<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#14151a"><title>和角色聊天 · OC Lab</title><link rel="stylesheet" href="shell.css?v=1014tavern"><link rel="stylesheet" href="chat.css?v=1016-private-gallery"><link rel="stylesheet" href="snapshot-card.css?v=hover-1015"></head><body><script src="shell.js?v=1015adultentry"></script>
<main class="chat-layout"><aside class="conversation-list" id="conversationList"><h1>聊天</h1><input id="chatSearch" type="search" placeholder="找一个角色…" aria-label="搜索聊天角色"><div id="conversations"><p class="muted">角色加载中…</p></div></aside>
<section class="conversation"><header class="conversation-head"><button id="showConversations" class="icon-button" aria-label="选择聊天角色">‹</button><button id="showProfile" class="identity-button"><img id="chatAvatar" alt=""><span id="chatName">选一个角色，开始聊天</span></button><span class="head-spacer"></span><button id="settingsButton" class="icon-button" aria-label="聊天设置">⚙</button></header>
<div id="chatLog" class="conversation-log" role="log" aria-live="polite"><div class="chat-empty">选一个喜欢的角色<br><small>查看角色资料，开始聊天</small></div></div>
<div id="chatPremium" class="chat-premium" hidden><span class="premium-heart" aria-hidden="true">♥</span><div><b id="premiumTitle">开启专属内容</b><small>角色图库与互动玩法</small></div><button id="premiumUnlock" type="button">解锁</button></div><div class="composer"><div id="snapshotConfirm" class="snapshot-confirm" hidden></div><div id="chatChoices" class="chat-suggestions"></div><div class="chat-media-menu" id="chatMediaMenu" hidden><button type="button" data-media-kind="selfie">要张照片</button><button type="button" data-media-kind="video">要段视频</button></div><form id="chatForm"><button id="chatCamera" type="button" hidden style="display:none" aria-hidden="true" tabindex="-1" aria-label="向角色要照片或视频" aria-expanded="false" aria-controls="chatMediaMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h4l2-3h4l2 3h4v14H4z"/><circle cx="12" cy="12" r="4"/></svg></button><textarea id="chatInput" rows="1" maxlength="1000" placeholder="和角色说点什么…" aria-label="聊天消息" disabled></textarea><button id="chatSend" type="submit" aria-label="发送消息" disabled>↑</button></form><p id="chatStatus" role="status"></p></div></section>
<aside class="character-profile" id="profile" hidden><button id="closeProfile" class="icon-button profile-close" aria-label="关闭角色资料">×</button><div class="portrait-stage"><img id="portrait" alt="角色立绘"><video id="portraitMotion" hidden muted loop playsinline preload="none" aria-label="角色动态"></video><button id="motionToggle" class="motion-toggle" hidden>播放动态</button><button id="portraitLock" class="portrait-lock" hidden><span>🔒</span><b>解锁专属图库</b><small>开启服务后查看完整图片</small></button><div class="portrait-controls"><button id="previousPortrait" aria-label="上一张角色图片">‹</button><span id="portraitCount"></span><button id="nextPortrait" aria-label="下一张角色图片">›</button></div></div><div class="profile-copy"><h2 id="profileName">角色资料</h2><p id="profileRole"></p><p id="profileSummary"></p><div id="privateGallery" class="private-gallery" hidden></div><dl id="chatState"><div><dt>场景</dt><dd>尚未开始</dd></div><div><dt>情绪</dt><dd>—</dd></div><div><dt>关系</dt><dd>初次相遇</dd></div></dl><button id="viewRoleplay" class="roleplay-entry">查看／编辑互动人设 →</button><a id="profileHome" href="./">查看角色主页 →</a><a id="profileCreate" href="templates">用角色做作品 →</a></div></aside></main>
<dialog id="chatSettings"><form method="dialog"><button class="icon-button settings-close" aria-label="关闭设置">×</button></form><h2>聊天设置</h2><label>互动档位<select id="chatTier"><option value="daily">日常聊天 · 1积分／轮（演示价）</option><option value="immersive" selected>沉浸互动 · 3积分／轮（演示价）</option><option value="story">长篇剧情 · 6积分／轮（演示价）</option></select></label><p id="tierInfo" class="muted"></p><p class="muted">演示价格，不扣费；正式价格待定。档位控制上下文容量与回复上限，切换不会清空记录。</p><label>叙事视角<select id="chatPov"><option value="second">沉浸式（你）</option><option value="first">角色第一人称</option><option value="third">第三人称旁白</option></select></label><label>回复长度<select id="chatLength"><option value="short">简短</option><option value="medium" selected>适中</option><option value="long">偏长</option></select></label><label>剧情节奏<select id="chatPace"><option value="slow">慢热</option><option value="natural" selected>自然</option><option value="fast">快速推进</option></select></label><button id="settingsRoleplay" class="roleplay-entry">查看／编辑互动人设</button><button id="clearChat" class="reset-chat">重新开始当前聊天</button><p class="muted">DeepSeek V4.1 Flash · 对话保存在当前浏览器</p></dialog>
<script src="chat.js?v=1016-private-gallery"></script><script src="snapshot-motion.js?v=hover-1015"></script></body></html>
