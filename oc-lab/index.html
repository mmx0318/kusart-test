const scard=(s,cls='')=>`<div class="pick sc ${cls} ${S.style===s.code?'sel':''}" data-k="${s.code}"><img src="${s.img}" loading="lazy" style="border-radius:15px"><div class="stl">${esc(s.name)} · ${esc(s.code)}<small>${esc((s.sub||'').split('（')[0])}</small></div></div>`;   // 10-08 木木夕：只放图，名字只在「设计说明」里给内部看
R[1]=()=>head(1)+`${H("选一个","画风","")}<div class="sub">${S.upload?'你上传了图：可以保持原图画风，也可以换一种':'同一个角色，用不同画风画出来的样子，选一个最喜欢的'}</div>
${S.upload?`<div class="ghost" id="keep" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;text-align:left"><img src="${S.upload}" style="width:54px;height:72px;object-fit:contain;border-radius:8px;background:#fff">保持原图画风<small style="margin-left:auto">免费 · 推荐</small></div>`:''}
<div class="wrapz styles" id="sty"></div>
<!-- 10-09 木木夕：「换一批风格」去掉 -->
<div class="dbg" id="src"></div>${S.upload?`<div class="dbg">从图里读出：${esc(TN(S.type))} · ${esc(S.desc)}</div>`:''}`+note('画风按角色类型推荐（10-08 木木夕）：复用风格 Jev（style-lab 同一份 router_v8 + 精选池 tblDUKN4）。用类型问 Jev 判角色类别（萝莉 / 美少女 / 御姐 / 正太 / 美少年 / 成熟男性 / 非人），男性类型会过滤掉「画不出男性 / 大叔会丑化」的风格；每种类型有自己的画风大类顺序，前 4 类各取池里排第一的 Anima 风格做主推，「换一批风格」从其余推荐里随机换 4 个。只取 Anima，去掉 10-07 扫出身材倾向明显的风格。例图：正太和少年用美少年例图、熟男用大叔例图，其余用同一句女生提示词的统一例图。上传图后选新画风会直接出图（跳过描述）。');
B[1]=async()=>{const ty=S.type||'少女';$('#sty').innerHTML='<div class="sub" style="grid-column:1/-1">按「'+esc(TN(ty))+'」挑画风中…</div>';

 // 10-08 木木夕：「查看更多」改成「换一批风格」，每次从其余推荐里随机换 4 个新的（不和当前这批重复，轮完一圈再从头）
 let shown=STY.main.map(s=>s.k||s.code),seen=new Set(shown);
 if($('#more'))$('#more').onclick=()=>{const all=[...STY.main,...STY.more],key=s=>s.k||s.code;let pool=all.filter(s=>!seen.has(key(s)));
  if(pool.length<4){seen=new Set(shown);pool=all.filter(s=>!shown.includes(key(s)))}

 ${o.ref?`<div class="shref"><button class="shrefb" data-r><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg><span>没想好？上传参考图，Mari 帮你写</span></button><small class="shrefn"></small></div>`:''}

 const ta=h.querySelector('.shin');let g=S.cusGender||'不限';setTimeout(()=>ta.focus(),250);
 h.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ta.value=b.dataset.ex;ta.focus()});
