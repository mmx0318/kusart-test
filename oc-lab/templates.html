<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>用角色创作 · OC Lab</title><link rel="stylesheet" href="templates.css?v=1014home-entry"></head><body>
<header><a id="backLink" href="./">‹ 首页</a><strong>用角色创作</strong><a id="characterHome" href="./" hidden>角色主页 ↗</a></header>
<main><div class="intro"><p id="introHint">挑款式，用你的角色做作品</p><h1 id="introTitle">先挑一款喜欢的效果</h1></div>
<section id="initialPicker" hidden><div id="initialCharacters" class="character-grid"></div><a class="secondary create-link" href="./">＋ 创建新角色</a></section>
<div class="character-panel" id="characterPanel" hidden><img id="characterArt" alt="当前角色"><div><strong id="characterName"></strong><p id="referenceHint">图片和资料已准备好</p></div><button class="secondary" id="changeCharacter">换角色</button></div>
<section id="jobPanel" hidden><h2 id="jobTitle">作品生成中</h2><p id="jobStatus" role="status" aria-live="polite"></p><div id="jobResult"></div></section>
<div id="library"><nav><button class="active" data-tab="templates">挑款式</button><button data-tab="works">作品库</button></nav>
<section id="templatePanel"><div class="section-head"><h2>想做哪一款？</h2><p>点开看效果，再一键生成</p></div><div id="templateGrid" class="grid"></div></section>
<section id="workPanel" hidden><div class="section-head"><h2 id="worksTitle">角色作品</h2><div class="segmented"><button class="active" data-filter="mine">TA 的作品</button><button data-filter="all">逛大家的作品</button></div></div><div id="workGrid" class="works"></div></section></div>
<p id="pageStatus" role="status"></p>
</main>
<dialog id="creator"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><div id="dialogContent"></div></dialog>
<script src="templates.js?v=1014home-entry"></script></body></html>
